[project]
name = "origem-monitor"
version = "0.1.0"
description = "Monitor do Origem (PI 3 · Infra de Software): coletor com threads e painel em 3 níveis"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "origem-estruturas",
]

[tool.uv]
package = false

[tool.uv.sources]
origem-estruturas = { path = "../estruturas", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
