# ============================================================================
# Origem completo em containers (PI 3 · AED + Infraestrutura de Software)
#
#   docker compose up -d --build     sobe tudo; o site abre em http://localhost:3000
#                                    e o painel do monitor em http://localhost:8080
#   docker compose ps                status e saúde de cada serviço
#   docker compose down              derruba (os dados ficam no volume)
#   docker compose down -v           derruba e apaga o banco (o seed roda de novo)
#
# No Podman sem root (Fedora, Bazzite), construa com o builder clássico: o
# BuildKit tenta subir um container próprio e falha.
#   DOCKER_BUILDKIT=0 docker compose up -d --build
#
# O coletor lê os containers pela API do Docker, pelo socket. No Podman sem
# root o socket fica em outro lugar: crie um .env na raiz (ignorado pelo git) com
#   SOCKET_DOCKER=/run/user/1000/podman/podman.sock
# e ligue o socket uma vez com: systemctl --user enable --now podman.socket
#
# Demonstração do OOM Killer (perfil "demo", não sobe com o resto):
#   docker compose --profile demo up estressor
#
# O backend/docker-compose.yml continua valendo para quem quer só o banco.
# Este arquivo NÃO publica o Postgres na máquina: só os outros containers o
# enxergam, então ele não colide com o banco de desenvolvimento (porta 5434).
#
# mem_limit: todo serviço tem limite de memória. O monitor (P3/P4) compara o
# uso com o limite, gera alertas de memória e registra quando o OOM Killer age.
# ============================================================================

name: origem

x-banco: &banco
  DATABASE_URL: postgres://origem:origem@postgres:5432/origem

# oom_score_adj acima de 200: no Podman sem root (Fedora, Bazzite) os containers
# herdam 200 do serviço do usuário, e o `exec` que roda os healthchecks falha ao
# regravar esse valor. Com 300 ele funciona. O efeito colateral é proposital:
# se a MÁQUINA ficar sem memória, o OOM Killer prefere matar um container a um
# processo do sistema. Dentro do limite de cada container (mem_limit) nada muda.
x-oom: &oom 300

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: origem
      POSTGRES_PASSWORD: origem
      POSTGRES_DB: origem
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Na primeira subida (volume vazio) roda schema, extensões, seed e fila.
      - ./backend/sql:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origem -d origem"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    oom_score_adj: *oom
    restart: unless-stopped

  api:
    build: ./backend
    image: origem-api
    environment:
      <<: *banco
      # Segredo só para este ambiente local de demonstração.
      JWT_SECRET: origem-compose-local-nao-usar-em-producao
      CORS_ORIGEM: http://localhost:3000
      # http://localhost: o cookie de sessão não pode exigir HTTPS aqui.
      COOKIE_SECURE: "false"
      RECOMENDACAO_URL: http://ia:3001
      # O worker roda no container próprio abaixo.
      WORKER_EMBUTIDO: "false"
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    oom_score_adj: *oom
    restart: unless-stopped

  worker:
    image: origem-api
    command: ["node", "src/worker.js"]
    environment:
      <<: *banco
    # A imagem traz o healthcheck da API, que não vale para o worker.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    mem_limit: 128m
    oom_score_adj: *oom
    restart: unless-stopped

  ia:
    build: ./ia-recomendacao
    image: origem-ia
    environment:
      <<: *banco
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    oom_score_adj: *oom
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://api:3333
    image: origem-frontend
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    oom_score_adj: *oom
    restart: unless-stopped

  # ------------------------------------------------------------ monitor (PI 3)
  # Coletor: threads que medem a máquina (/proc), produtoras de um buffer em
  # fila circular própria, e uma thread consumidora que mantém o estado.
  coletor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    image: origem-monitor
    environment:
      PROC: /host/proc
      RAIZ: /host/root
      SOCKET_DOCKER: /var/run/docker.sock
      PROJETO_COMPOSE: origem
      SERVICOS: api=http://api:3333/saude,ia=http://ia:3001/healthz,frontend=http://frontend:3000/,painel=http://painel:8080/saude
      ARQUIVO_EVENTOS: /dados/eventos.jsonl
    volumes:
      # O /proc e a raiz da MÁQUINA, somente leitura: o coletor mede o host,
      # não o próprio container. Nunca use :z aqui (reetiquetaria o sistema
      # inteiro no SELinux); por isso o rótulo é desligado só neste serviço.
      - /proc:/host/proc:ro
      - /:/host/root:ro
      # API do Docker (ou do Podman), só para LER containers e estatísticas.
      - ${SOCKET_DOCKER:-/var/run/docker.sock}:/var/run/docker.sock
      # Eventos e alertas em JSONL, preservados entre reinícios.
      - eventos:/dados
    security_opt:
      - label=disable
    mem_limit: 128m
    oom_score_adj: *oom
    restart: unless-stopped

  painel:
    image: origem-monitor
    command: ["uv", "run", "--frozen", "--no-dev", "uvicorn", "monitor.painel_app:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      PORTA: "8080"
      COLETOR_URL: http://coletor:8001
    ports:
      - "8080:8080"
    depends_on:
      coletor:
        condition: service_healthy
    mem_limit: 128m
    oom_score_adj: *oom
    restart: unless-stopped

  # Demonstração: aloca memória até o OOM Killer matar o processo (código 137).
  # restart "no" para o container ficar parado e marcado como OOMKilled.
  estressor:
    image: origem-monitor
    profiles: ["demo"]
    # O Python do ambiente direto, sem o `uv run`: o uv sozinho já passaria de 64 MB.
    command: ["/app/monitor/.venv/bin/python", "-m", "monitor.estressor"]
    environment:
      # 1 MB a cada 0,5 s: o coletor, que lê a cada 3 s, vê a memória passar de 80% e de 95% antes do OOM.
      BLOCO_MB: "1"
      PAUSA_S: "0.5"
    healthcheck:
      disable: true
    mem_limit: 64m
    memswap_limit: 64m
    oom_score_adj: *oom
    restart: "no"

volumes:
  pgdata:
  eventos:
